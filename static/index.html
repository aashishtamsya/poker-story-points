<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Poker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0D9488;
            --secondary: #14B8A6;
            --accent: #EA580C;
            --bg: #0a0e14;
            --surface: #141b24;
            --surface-elevated: #1c2634;
            --text: #e0e6ed;
            --text-muted: #94a3b8;
            --border: #2d3748;
            --success: #10b981;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* Join Screen */
        .join-screen {
            max-width: 420px;
            margin: 0 auto;
            background: var(--surface);
            padding: 48px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .join-screen h1 {
            margin-bottom: 32px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            transition: all 180ms ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .role-selector {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 180ms ease;
        }

        .role-btn:hover {
            border-color: var(--primary);
            background: var(--surface-elevated);
        }

        .role-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .role-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius);
            color: #000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 180ms ease;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.2);
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* Game Screen */
        .game-screen {
            display: none;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-dropdown {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .share-btn {
            padding: 8px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            transition: all 200ms ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .share-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .share-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
        }

        .share-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .share-modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .share-modal-header {
            margin-bottom: 24px;
        }

        .share-modal-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 8px 0;
        }

        .share-modal-header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }

        .share-link-group {
            margin-bottom: 20px;
        }

        .share-link-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .share-link-input {
            display: flex;
            gap: 8px;
        }

        .share-link-input input {
            flex: 1;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .copy-btn {
            padding: 10px 16px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 200ms ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background: var(--accent);
        }

        .modal-close-btn {
            width: 100%;
            padding: 12px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: all 200ms ease;
            margin-top: 8px;
        }

        .modal-close-btn:hover {
            background: var(--bg);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .game-content {
            margin-top: 80px;
            padding-bottom: 180px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
            padding: 20px 24px;
        }

        .room-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .room-code {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .room-code span {
            color: var(--primary);
            font-weight: 600;
            font-family: 'Inter', monospace;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .controls button {
            padding: 10px 20px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 180ms ease;
        }

        .controls button:hover {
            border-color: var(--primary);
            background: var(--bg);
        }

        .controls button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        .controls button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .controls button.primary:hover {
            opacity: 0.9;
        }

        /* Poker Table */
        .poker-table {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 0;
            min-height: 600px;
        }

        .center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            padding: 48px 80px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
            min-width: 280px;
        }

        .result {
            font-size: 72px;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        /* Player Positions */
        .players-container {
            position: relative;
            width: 100%;
            height: 600px;
        }

        .player {
            position: absolute;
            text-align: center;
        }

        .emoji-picker.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .player:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
        .player:nth-child(2) { top: 10%; left: 75%; }
        .player:nth-child(3) { top: 50%; left: 85%; transform: translateY(-50%); }
        .player:nth-child(4) { bottom: 10%; left: 75%; }
        .player:nth-child(5) { bottom: 0; left: 50%; transform: translateX(-50%); }
        .player:nth-child(6) { bottom: 10%; left: 15%; }
        .player:nth-child(7) { top: 50%; left: 5%; transform: translateY(-50%); }
        .player:nth-child(8) { top: 10%; left: 15%; }

        .card {
            width: 80px;
            height: 120px;
            background: var(--surface-elevated);
            border: 2px solid var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            transition: all 240ms ease;
            position: relative;
            overflow: visible;
        }

        .edit-vote-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 32px;
            height: 32px;
            background: var(--surface-elevated);
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 180ms ease;
            z-index: 5;
        }

        .card:hover .edit-vote-btn {
            display: flex;
        }

        .edit-vote-btn:hover {
            transform: scale(1.1);
            background: var(--primary);
        }

        .edit-vote-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--primary);
        }

        .edit-vote-btn:hover svg {
            stroke: #000;
        }

        .tooltip {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .edit-vote-btn:hover .tooltip {
            opacity: 1;
        }

        .card.waiting {
            background: var(--surface);
            border-color: var(--border);
            color: transparent;
        }

        .card.waiting::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(13, 148, 136, 0.1),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .card.hidden {
            background: var(--surface);
            border-color: var(--border);
            color: transparent;
        }

        .card.voted {
            border-color: var(--success);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
        }

        .player-name {
            font-size: 13px;
            font-weight: 400;
            color: var(--text);
            margin-top: 4px;
        }

        /* Vote Panel */
        .vote-panel {
            display: none;
            margin-top: 48px;
            margin-bottom: 24px;
            padding: 32px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .vote-panel.active {
            display: block;
        }

        .vote-panel h3 {
            margin-bottom: 24px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .vote-options {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .vote-btn {
            width: 72px;
            height: 104px;
            background: var(--surface-elevated);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            transition: all 200ms ease;
        }

        .vote-btn:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
        }

        .vote-btn:active {
            transform: translateY(-2px);
        }

        .vote-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
        }

        .vote-btn.selected {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        .hidden {
            display: none;
        }

        /* Bottom Stats */
        .bottom-stats {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 48px;
            padding: 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .bottom-stats.active {
            display: flex;
        }

        .vote-distribution {
            display: flex;
            align-items: flex-end;
            gap: 16px;
        }

        .vote-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .bar-container {
            width: 48px;
            height: 80px;
            display: flex;
            align-items: flex-end;
        }

        .bar {
            width: 100%;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            transition: height 300ms ease;
            position: relative;
        }

        .bar-count {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .bar-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Emoji Reactions */
        .emoji-picker {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 6px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 48px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        }

        .emoji-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            background: rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .emoji-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 250ms ease;
        }

        .emoji-btn:hover {
            transform: scale(1.15) translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(13, 148, 136, 0.3),
                        0 0 0 2px rgba(13, 148, 136, 0.2);
        }

        .emoji-btn:hover::before {
            opacity: 1;
        }

        .emoji-btn:active {
            transform: scale(1.05) translateY(0);
            box-shadow: 0 2px 8px rgba(13, 148, 136, 0.4),
                        0 0 0 2px rgba(13, 148, 136, 0.3);
        }

        .flying-emoji {
            position: fixed;
            font-size: 48px;
            pointer-events: none;
            z-index: 1000;
            animation: fly-to-target 1200ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
        }

        @keyframes fly-to-target {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 1;
                transform: translate(calc(var(--mid-x) * 0.1), calc(var(--mid-y) * 0.1)) rotate(36deg) scale(1);
            }
            50% {
                opacity: 1;
                transform: translate(var(--mid-x), var(--mid-y)) rotate(180deg) scale(1.3);
            }
            90% {
                opacity: 1;
                transform: translate(calc(var(--target-x) * 0.95), calc(var(--target-y) * 0.95)) rotate(324deg) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--target-x), var(--target-y)) rotate(360deg) scale(0.3);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .join-screen {
                padding: 32px 24px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
            }

            .center-area {
                padding: 32px 48px;
            }

            .result {
                font-size: 48px;
            }

            .poker-table {
                padding: 40px 0;
            }

            .players-container {
                height: 500px;
            }

            .card {
                width: 64px;
                height: 96px;
                font-size: 24px;
            }

            .vote-btn {
                width: 60px;
                height: 88px;
                font-size: 22px;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .card.waiting::before {
                animation: none;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Join Screen -->
        <div class="join-screen" id="joinScreen">
            <h1>Planning Poker</h1>
            <form id="joinForm">
                <div class="form-group">
                    <label for="nameInput">Your Name</label>
                    <input type="text" id="nameInput" placeholder="Enter your name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Join as</label>
                    <div class="role-selector">
                        <button type="button" class="role-btn active" data-role="host">Host</button>
                        <button type="button" class="role-btn" data-role="member">Member</button>
                        <button type="button" class="role-btn" data-role="spectator">Spectator</button>
                    </div>
                </div>
                <div class="form-group hidden" id="roomCodeGroup">
                    <label for="roomCodeInput">Room Code</label>
                    <input type="text" id="roomCodeInput" placeholder="Enter room code" autocomplete="off">
                </div>
                <button type="submit" class="btn">Join Session</button>
            </form>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <div class="top-nav">
                <div class="room-info">
                    <div class="room-dropdown">
                        <span id="displayRoomCode"></span>
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
                            <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <button class="share-btn hidden" id="shareBtn" title="Share room links">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                    </button>
                </div>
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar"></div>
                    <span id="userName"></span>
                    <div class="controls hidden" id="hostControls">
                        <button id="startBtn">Start Voting</button>
                        <button id="revealBtn" class="primary hidden">Reveal</button>
                        <button id="resetBtn" class="hidden">New Round</button>
                    </div>
                </div>
            </div>

            <div class="game-content">
                <div class="poker-table">
                    <div class="players-container" id="playersContainer">
                        <!-- Players dynamically added -->
                    </div>
                    <div class="center-area">
                        <div class="result" id="result">?</div>
                    </div>
                </div>

                <div class="vote-panel" id="votePanel">
                    <h3>Select Your Estimate</h3>
                    <div class="vote-options">
                        <button class="vote-btn" data-vote="0">0</button>
                        <button class="vote-btn" data-vote="1">1</button>
                        <button class="vote-btn" data-vote="2">2</button>
                        <button class="vote-btn" data-vote="3">3</button>
                        <button class="vote-btn" data-vote="5">5</button>
                        <button class="vote-btn" data-vote="8">8</button>
                        <button class="vote-btn" data-vote="13">13</button>
                    </div>
                </div>
            </div>

            <div class="bottom-stats" id="bottomStats">
                <div class="vote-distribution" id="voteDistribution">
                    <!-- Vote bars dynamically added -->
                </div>
                <div class="stat-item">
                    <div class="stat-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div class="stat-value" id="agreementValue">-</div>
                    <div class="stat-label">Agreement</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="averageValue">-</div>
                    <div class="stat-label">Average</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="share-modal" id="shareModal">
        <div class="share-modal-content">
            <div class="share-modal-header">
                <h3>Share Room Links</h3>
                <p>Share these links with your team to join this room</p>
            </div>

            <div class="share-link-group">
                <label>For Team Members (Voting)</label>
                <div class="share-link-input">
                    <input type="text" id="memberLinkInput" readonly>
                    <button class="copy-btn" data-target="memberLinkInput">Copy</button>
                </div>
            </div>

            <div class="share-link-group">
                <label>For Spectators (View Only)</label>
                <div class="share-link-input">
                    <input type="text" id="spectatorLinkInput" readonly>
                    <button class="copy-btn" data-target="spectatorLinkInput">Copy</button>
                </div>
            </div>

            <button class="modal-close-btn" id="closeShareModal">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
